name: Release

# Publishes to npm when a push to main carries a version that is not on npm
# yet. The version is set by hand in package.json; a merge that leaves it
# unchanged (documentation, CI, tests) publishes nothing.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check whether the version is new
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Compare with npm
        id: version
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if output="$(npm view "$name@$version" version 2>&1)"; then
            if [ -n "$output" ]; then
              echo "$name@$version is already on npm; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 <<< "$output"; then
            # Any failure other than "not found" must not lead to a publish.
            echo "$output" >&2
            exit 1
          fi
          echo "$name@$version is not on npm yet; publishing."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # npm trusted publishing (OIDC) needs the npm 11 that ships with
          # Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      # npm uses trusted publishing when the package has it configured, and
      # falls back to the NPM_TOKEN secret otherwise (as on a first publish).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks
